name: Build and Package HaloMonitor

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (win-x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore HaloMonitor/HaloMonitor.csproj

    - name: Publish standalone single-file
      run: |
        dotnet publish HaloMonitor/HaloMonitor.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          /p:PublishSingleFile=true `
          /p:IncludeNativeLibrariesForSelfExtract=true `
          /p:PublishTrimmed=false `
          -o ./publish/win-x64

    - name: Ensure appsettings.json exists in output
      shell: pwsh
      run: |
        if (-not (Test-Path "./publish/win-x64/appsettings.json")) {
          Copy-Item "HaloMonitor/appsettings.json" -Destination "./publish/win-x64/appsettings.json"
        }

    - name: Create Zip Archive
      shell: pwsh
      run: |
        Compress-Archive -Path "./publish/win-x64/*" -DestinationPath "./HaloMonitor-win-x64.zip" -Force

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HaloMonitor-win-x64
        path: |
          ./HaloMonitor-win-x64.zip
          ./publish/win-x64/HaloMonitor.exe
          ./publish/win-x64/appsettings.json

    - name: Publish Release Asset (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./HaloMonitor-win-x64.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
